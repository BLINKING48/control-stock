<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Almacén Indirectos WRA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --azul-principal: #2643A4;
      --azul-secundario: #1b2f73;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #eee;
      margin: 20px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 10px;
      color: var(--azul-principal);
    }

    .seccion-titulo {
      background-color: #222;
      padding: 20px;
      margin: 10px 0;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      box-shadow: 0 0 10px var(--azul-principal);
    }

    .formulario-container, .busqueda-container, .tabla-container, .grafica-container, .footer-container {
      background-color: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(38, 67, 164, 0.5);
    }

    form, .busqueda-container, .footer-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input {
      background-color: #333;
      color: #eee;
      border: 1px solid #555;
    }

    button {
      background-color: var(--azul-principal);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: var(--azul-secundario);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #444;
      padding: 10px;
      text-align: center;
    }

    .alerta {
      color: #ff4d4d;
      font-weight: bold;
    }

    canvas {
      background-color: #fff;
      border-radius: 12px;
      padding: 10px;
    }

    .borrar {
      background-color: #ff4d4d;
      color: white;
    }
  </style>
</head>
<body>
  <div class="seccion-titulo">ALMACÉN INDIRECTOS WRA</div>
  <div class="seccion-titulo">INVENTARIO</div>

  <div class="formulario-container">
    <form id="formulario">
      <input type="text" id="parte" placeholder="Número de Parte" required />
      <input type="number" id="cantidad" placeholder="Cantidad Actual" required />
      <input type="number" id="minimo" placeholder="Stock Mínimo" required />
      <input type="number" id="maximo" placeholder="Stock Máximo" required />
      <button type="submit">Guardar</button>
      <button type="button" id="btnActualizar">Actualizar</button>
    </form>
  </div>

  <div class="busqueda-container">
    <input type="text" id="busqueda" placeholder="Buscar Número de Parte" />
    <button type="button" id="btnBuscar">Buscar</button>
  </div>
  <div id="alertas" class="explicacion"></div>

  <div class="tabla-container">
    <table id="tablaStock">
      <thead>
        <tr>
          <th>Número de Parte</th>
          <th>Cantidad</th>
          <th>Mínimo</th>
          <th>Máximo</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="grafica-container">
    <h2>Gráfica de Inventario</h2>
    <canvas id="graficoStock" width="600" height="300"></canvas>
  </div>

  <div class="footer-container">
    <input type="date" />
    <button>Buscar</button>
    <button>EXPORTAR A SHEET</button>
  </div>

  <!-- SCRIPT ORIGINAL SE MANTIENE IGUAL -->
  <script>
    // ... Tu script JS completo permanece sin cambios ...
  </script>
</body>
</html>
